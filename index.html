<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ff4f9a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>o nosso wrapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --rosa:#ff4f9a; --rosa-forte:#e8247a; --rosa-claro:#ffc4dc; --rosa-bebe:#ffe4ef;
  --creme:#fff6ee; --vinho:#3b0820; --vinho-2:#5c0f33; --pessego:#ffb59e;
  --fonte:'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --topo:env(safe-area-inset-top, 0px);
  --baixo:env(safe-area-inset-bottom, 0px);
  --u:3.9px; --v:8px; /* 1% da largura e da altura do palco (o JS acerta) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1e0410}
body{
  font-family:var(--fonte);color:var(--vinho);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
img{-webkit-touch-callout:none;pointer-events:none;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- o palco (tela cheia no celular, em pé no computador) ---------- */
#palco{position:fixed;top:0;bottom:0;left:0;right:0;overflow:hidden;touch-action:none;background:var(--rosa-bebe);cursor:pointer}
@media (min-aspect-ratio: 4/5){
  #palco{left:50%;right:auto;width:calc(100vh * 9 / 16);transform:translateX(-50%)}
  body{background:radial-gradient(circle at 50% 40%, #5c0f33, #1e0410 70%)}
}
#fundo{position:absolute;inset:0;width:100%;height:100%;display:block}
#palco.sem-webgl #fundo{display:none}
#grao{
  position:absolute;inset:0;pointer-events:none;opacity:.09;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* ---------- barrinhas e som ---------- */
#topo{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(var(--topo) + 10px) 12px 0;display:flex;gap:10px;align-items:center;pointer-events:none;transition:opacity .5s}
#barras{flex:1;display:flex;gap:4px}
.barra{flex:1;height:3px;border-radius:3px;background:currentColor;opacity:.3;overflow:hidden;position:relative}
.barra.feita{opacity:1}
.barra.agora{opacity:1;background:transparent}
.barra.agora::before{content:'';position:absolute;inset:0;background:currentColor;opacity:.3}
.barra i{position:absolute;inset:0;background:currentColor;transform-origin:left;transform:scaleX(0)}
.barra.feita i{transform:scaleX(1)}
#som{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.22);display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#som svg{width:18px;height:18px}
#som .x{display:none}
#palco.mudo #som .x{display:block}
#palco.mudo #som .ondas{display:none}
#palco[data-tema=claro] #topo{color:var(--vinho)}
#palco[data-tema=forte] #topo,#palco[data-tema=escuro] #topo,#palco[data-tema=foto] #topo{color:#fff}
#palco[data-tema=foto] #barras{filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
#palco[data-tema=claro] #som{background:rgba(59,8,32,.1)}
#palco.no-comeco #barras{opacity:0}

/* ---------- cada tela ---------- */
#historias{position:absolute;inset:0}
.historia{
  position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
  padding:calc(var(--topo) + 64px) calc(var(--u) * 7.5) calc(var(--baixo) + 36px);
  overflow:hidden;
}
.historia.ativa{display:flex}
.tema-claro{color:var(--vinho)}
.tema-forte{color:var(--creme)}
.tema-escuro{color:var(--rosa-claro)}
.tema-foto{color:var(--creme);justify-content:flex-end}
.conteudo{position:relative;z-index:2;display:flex;flex-direction:column;gap:min(calc(var(--u)*3.4), calc(var(--v)*1.7))}

.olho{font-size:min(calc(var(--u)*3.5), calc(var(--v)*1.75));font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.gigante{font-size:min(calc(var(--u)*30), calc(var(--v)*15));font-weight:800;line-height:.86;letter-spacing:-.05em;font-variation-settings:'opsz' 96}
.grande{font-size:min(calc(var(--u)*15), calc(var(--v)*7.4));font-weight:800;line-height:.95;letter-spacing:-.035em;font-variation-settings:'opsz' 96}
.medio{font-size:min(calc(var(--u)*8.6), calc(var(--v)*4.3));font-weight:700;line-height:1.05;letter-spacing:-.02em}
.texto{font-size:min(calc(var(--u)*5.3), calc(var(--v)*2.65));font-weight:500;line-height:1.3;white-space:pre-line}
.pequeno{font-size:min(calc(var(--u)*3.8), calc(var(--v)*1.9));font-weight:500;opacity:.78}
.destaque{color:var(--rosa-forte)}
.tema-forte .destaque{color:var(--vinho)}
.tema-escuro .destaque{color:var(--rosa)}
.tema-foto .destaque{color:var(--rosa-claro)}
.pilula{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.22);font-weight:700;font-size:min(calc(var(--u)*3.9), calc(var(--v)*1.95))}
.tema-claro .pilula{background:rgba(59,8,32,.08)}
.linha{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- animações (o estado final é o normal; elas só entram) ---------- */
@keyframes subir{from{opacity:0;transform:translateY(calc(var(--u)*9))}}
@keyframes surgir{from{opacity:0;transform:scale(.55)}}
@keyframes aparecer{from{opacity:0}}
@keyframes esticarX{from{transform:scaleX(0)}}
@keyframes esticarY{from{transform:scaleY(0)}}
@keyframes girarEntra{from{opacity:0;transform:rotate(var(--r0,-30deg)) scale(.3)}}
@keyframes girarSempre{to{transform:rotate(360deg)}}
@keyframes flutuar{50%{transform:translateY(calc(var(--u)*-2)) rotate(var(--r,0deg))}}
@keyframes descer{from{transform:translateY(-30%)}to{transform:translateY(0)}}
@keyframes subirColuna{from{transform:translateY(0)}to{transform:translateY(-30%)}}
@keyframes zoom{from{transform:scale(1.18)}to{transform:scale(1.02)}}
.ativa .a-subir{animation:subir .9s cubic-bezier(.16,1,.3,1) var(--d,0s) both}
.ativa .a-surgir{animation:surgir .9s cubic-bezier(.34,1.56,.64,1) var(--d,0s) both}
.ativa .a-aparecer{animation:aparecer 1s ease var(--d,0s) both}
.ativa .a-esticar{animation:esticarX 1.2s cubic-bezier(.16,1,.3,1) var(--d,0s) both;transform-origin:left center}
.ativa .a-coluna{animation:esticarY 1s cubic-bezier(.16,1,.3,1) var(--d,0s) both;transform-origin:bottom center}
.ativa .a-girar{animation:girarEntra 1.1s cubic-bezier(.34,1.4,.64,1) var(--d,0s) both}
#palco.pausado .historia.ativa,#palco.pausado .historia.ativa *{animation-play-state:paused!important}
#palco.parado .historia,#palco.parado .historia *{animation-duration:0s!important;animation-delay:0s!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion: reduce){
  .ativa .a-subir,.ativa .a-surgir,.ativa .a-girar{animation-name:aparecer}
  .forma,.mosaico .col{animation:none!important}
}

/* ---------- formas de enfeite ---------- */
.forma{position:absolute;z-index:1;pointer-events:none}
.forma.gira{animation:girarSempre 40s linear infinite}
.forma.boia{animation:flutuar 6s ease-in-out infinite}

/* ---------- abertura ---------- */
.abertura .conteudo{align-items:flex-start}
.botao{
  margin-top:min(calc(var(--u)*4), calc(var(--v)*2));
  padding:16px 28px;border-radius:999px;border:0;background:var(--vinho);color:var(--creme);
  font-size:min(calc(var(--u)*4.8), calc(var(--v)*2.4));font-weight:800;letter-spacing:-.01em;display:inline-flex;gap:10px;align-items:center;
  box-shadow:0 10px 30px rgba(59,8,32,.25)
}
.tema-forte .botao,.tema-escuro .botao,.tema-foto .botao{background:var(--creme);color:var(--vinho)}
.botao.claro{background:rgba(255,255,255,.22);color:inherit;box-shadow:none}

/* ---------- polaroid ---------- */
.polaroid{position:absolute;z-index:1;background:#fff;padding:8px 8px 30px;border-radius:4px;box-shadow:0 18px 40px rgba(59,8,32,.28);transform:rotate(var(--r,6deg))}
.polaroid img{width:100%;height:100%;object-fit:cover;border-radius:2px}

/* ---------- barras (quem manda mais, horas, meses) ---------- */
.dupla{display:flex;flex-direction:column;gap:14px;margin:6px 0}
.dupla .nome{display:flex;justify-content:space-between;font-weight:700;font-size:min(calc(var(--u)*4.4), calc(var(--v)*2.2));margin-bottom:6px}
.dupla .trilho{height:min(calc(var(--u)*9), calc(var(--v)*4.5));border-radius:999px;background:rgba(59,8,32,.08);overflow:hidden}
.dupla .enche{height:100%;border-radius:999px;background:var(--rosa-forte)}
.dupla .enche.ele{background:var(--vinho)}
.colunas{display:flex;align-items:flex-end;gap:3px;height:min(calc(var(--u)*34), calc(var(--v)*17))}
.colunas i{flex:1;border-radius:3px 3px 0 0;background:currentColor;opacity:.32;min-height:2px}
.colunas i.pico{opacity:1;background:var(--rosa)}
.eixo{display:flex;justify-content:space-between;font-size:12px;font-weight:600;opacity:.6;margin-top:6px}
.meses .colunas{height:min(calc(var(--u)*16), calc(var(--v)*8));gap:8px}
.meses .colunas i{opacity:.45;border-radius:4px 4px 0 0}

/* ---------- emojis ---------- */
.emoji-gigante{font-size:min(calc(var(--u)*40), calc(var(--v)*20));line-height:1.15;margin-bottom:6px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.emojis{display:flex;gap:10px;flex-wrap:wrap}
.emojis span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px;border-radius:18px;background:rgba(59,8,32,.07);font-weight:700;font-size:13px}
.emojis b{font-size:min(calc(var(--u)*8), calc(var(--v)*4));font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-weight:400}

/* ---------- listas "top" ---------- */
.lista{display:flex;flex-direction:column;gap:min(calc(var(--u)*3.2), calc(var(--v)*1.6))}
.item{display:flex;align-items:center;gap:min(calc(var(--u)*4), calc(var(--v)*2))}
.item .pos{font-size:min(calc(var(--u)*10), calc(var(--v)*5));font-weight:800;width:1.1em;flex:none;letter-spacing:-.04em;line-height:1}
.item .capa{width:min(calc(var(--u)*15), calc(var(--v)*7.5));height:min(calc(var(--u)*15), calc(var(--v)*7.5));border-radius:6px;object-fit:cover;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.item .tit{font-size:min(calc(var(--u)*5.6), calc(var(--v)*2.8));font-weight:800;line-height:1.05;letter-spacing:-.02em}
.item .sub{font-size:min(calc(var(--u)*3.7), calc(var(--v)*1.85));font-weight:500;opacity:.75;margin-top:2px}
.item:first-child .tit{font-size:min(calc(var(--u)*7), calc(var(--v)*3.5))}

/* ---------- capas em leque ---------- */
.leque{position:relative;height:min(calc(var(--u)*42), calc(var(--v)*21));margin-bottom:6px}
.leque img{position:absolute;left:50%;top:0;width:min(calc(var(--u)*38), calc(var(--v)*19));height:min(calc(var(--u)*38), calc(var(--v)*19));margin-left:calc(min(calc(var(--u)*38), calc(var(--v)*19)) / -2);border-radius:8px;object-fit:cover;box-shadow:0 18px 40px rgba(0,0,0,.35)}

/* ---------- foto de fundo inteira ---------- */
.foto-fundo{position:absolute;inset:0;z-index:0}
.foto-fundo img,.foto-fundo video{width:100%;height:100%;object-fit:cover;display:block}
.ativa .foto-fundo img{animation:zoom 12s ease-out both}
.foto-fundo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(59,8,32,.35) 0%, rgba(59,8,32,0) 30%, rgba(59,8,32,.55) 60%, rgba(59,8,32,.92) 100%)}

/* ---------- mosaico de fotos ---------- */
.mosaico{position:absolute;inset:-10% -14%;display:flex;gap:10px;transform:rotate(-8deg);z-index:0;opacity:.95}
.mosaico .col{flex:1;display:flex;flex-direction:column;gap:10px}
.ativa .mosaico .col{animation:subirColuna 14s linear both}
.ativa .mosaico .col:nth-child(2){animation-name:descer}
.mosaico img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.selo{align-self:center;text-align:center;background:var(--creme);color:var(--vinho);padding:min(calc(var(--u)*6), calc(var(--v)*3)) min(calc(var(--u)*8), calc(var(--v)*4));border-radius:28px;box-shadow:0 20px 50px rgba(59,8,32,.35)}

/* ---------- balão da primeira mensagem ---------- */
.conversa{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin:6px 0}
.respondeu{font-size:min(calc(var(--u)*3.4), calc(var(--v)*1.7));font-weight:600;opacity:.7}
.story-mini{width:min(calc(var(--u)*22), calc(var(--v)*11));height:min(calc(var(--u)*36), calc(var(--v)*18));border-radius:14px;background:linear-gradient(160deg,#ffd0e2,#ff7eb3 55%,#ffb59e);box-shadow:0 10px 26px rgba(59,8,32,.25);position:relative;overflow:hidden}
.story-mini::after{content:'';position:absolute;left:10px;right:10px;top:8px;height:3px;border-radius:3px;background:rgba(255,255,255,.7)}
.balao.dela{align-self:flex-start;border-radius:24px 24px 24px 6px;background:#fff;color:var(--vinho);box-shadow:0 12px 30px rgba(59,8,32,.14)}
.balao{max-width:86%;align-self:flex-end;padding:14px 18px;border-radius:24px 24px 6px 24px;background:linear-gradient(135deg,#ff4f9a,#d6145c);color:#fff;font-size:min(calc(var(--u)*5.6), calc(var(--v)*2.8));font-weight:600;line-height:1.25;box-shadow:0 12px 30px rgba(214,20,92,.35)}

/* ---------- motivos ---------- */
.motivo{min-height:3.3em;display:flex;align-items:flex-end}

/* ---------- resumo ---------- */
.cartao{background:var(--creme);color:var(--vinho);border-radius:26px;padding:min(calc(var(--u)*4.5), calc(var(--v)*2.2));box-shadow:0 24px 60px rgba(59,8,32,.3);display:flex;flex-direction:column;gap:min(calc(var(--u)*3.5), calc(var(--v)*1.6))}
.cartao .foto{height:min(calc(var(--u)*46), calc(var(--v)*23));border-radius:18px;overflow:hidden}
.cartao .foto img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:min(calc(var(--u)*3), calc(var(--v)*1.4)) 14px}
.grade .rot{font-size:min(calc(var(--u)*3.2), calc(var(--v)*1.6));font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.grade .val{font-size:min(calc(var(--u)*6.4), calc(var(--v)*3.2));font-weight:800;letter-spacing:-.03em;line-height:1.05}
.cartao .assina{display:flex;justify-content:space-between;font-weight:700;font-size:min(calc(var(--u)*3.4), calc(var(--v)*1.7));opacity:.7}
</style>
</head>
<body>
<div id="palco" class="no-comeco">
  <canvas id="fundo"></canvas>
  <div id="grao"></div>
  <div id="historias"></div>
  <div id="topo">
    <div id="barras"></div>
    <button id="som" aria-label="ligar ou desligar o som">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><g class="ondas"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g><g class="x"><path d="m16 9 6 6"/><path d="m22 9-6 6"/></g></svg>

  </div>
</div>

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function fmt(n){ return Math.round(n).toLocaleString('pt-BR'); }
function dia(a){ return new Date(a[0], a[1] - 1, a[2]); }
function ddmm(d){ return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); }
function iso(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function isoParaData(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function conta(alvo, d, t){ return '<span class="conta" data-alvo="' + alvo + '" data-d="' + (d || 0) + '" data-t="' + (t || 1.6) + '">0</span>'; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

var HOJE = (function(){
  var h = P.get('hoje');
  var d = h ? isoParaData(h) : new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
})();
var DIAS = Math.round((HOJE - dia(COMECO)) / 864e5);
var DIAS_NAMORO = Math.round((HOJE - dia(NAMORO)) / 864e5);
var MESES_NAMORO = (function(){
  var m = 0;
  while (new Date(NAMORO[0], NAMORO[1] - 1 + m + 1, NAMORO[2]) <= HOJE) m++;
  return m;
})();
var PROXIMO_MES = new Date(NAMORO[0], NAMORO[1] - 1 + MESES_NAMORO + 1, NAMORO[2]);
var DIAS_ATE_PROXIMO = Math.round((PROXIMO_MES - HOJE) / 864e5);

/* ---------- formas de enfeite ---------- */
function estrela(pontas, dentro){
  var pts = [];
  for (var i = 0; i < pontas * 2; i++){
    var r = i % 2 ? dentro : 50, a = Math.PI * i / pontas - Math.PI / 2;
    pts.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1));
  }
  return '<polygon points="' + pts.join(' ') + '"/>';
}
var FORMAS = {
  estrela: estrela(12, 38),
  explosao: estrela(16, 30),
  flor: (function(){ var s = ''; for (var i = 0; i < 6; i++){ var a = i * Math.PI / 3; s += '<circle cx="' + (50 + 24 * Math.cos(a)).toFixed(1) + '" cy="' + (50 + 24 * Math.sin(a)).toFixed(1) + '" r="22"/>'; } return s + '<circle cx="50" cy="50" r="16" opacity=".55"/>'; })(),
  coracao: '<path d="M50 88 C20 68 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 21 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 68 50 88Z"/>',
  circulo: '<circle cx="50" cy="50" r="48"/>',
  onda: '<path d="M2 50 Q14 20 26 50 T50 50 T74 50 T98 50" fill="none" stroke-width="9" stroke-linecap="round"/>'
};
// forma('estrela', x%, y%, tamanho em % da largura, cor, classe extra, delay)
function forma(tipo, x, y, tam, cor, extra, d){
  var traco = tipo === 'onda';
  return '<div class="forma ' + (extra || '') + '" style="left:' + x + '%;top:' + y + '%;width:calc(var(--u)*' + tam + ');margin:calc(var(--u)*' + (-tam / 2) + ') 0 0 calc(var(--u)*' + (-tam / 2) + ')">' +
    '<svg class="a-girar" style="--d:' + (d || 0) + 's;width:100%;display:block" viewBox="0 0 100 100" ' + (traco ? 'stroke="' + cor + '"' : 'fill="' + cor + '"') + '>' + FORMAS[tipo] + '</svg></div>';
}
function img(nome, classe){ return '<img ' + (classe ? 'class="' + classe + '" ' : '') + 'data-src="fotos/' + nome + '.jpg" alt="">'; }

/* ---------- as telas ---------- */
var HIST = [];
function nova(h){
  if (h.precisa === 'whats' && !W) return;

}

/* ---------- o fundo rosa (WebGL, bem leve) ---------- */
var PALETAS = {
  claro:  ['#ffe1ec', '#ffb3cf', '#fff3e8', '#ff9cc4', '#ffcfb8'],
  creme:  ['#fff4ea', '#ffd3e3', '#fffaf4', '#ffbfd5', '#ffe0cf'],
  forte:  ['#ff3d8b', '#d6145c', '#ff80b5', '#ff9a7a', '#ff52a2'],
  escuro: ['#2a0517', '#6e0f3d', '#3d0a22', '#a3195c', '#4a0b2a'],
  vinho:  ['#3b0820', '#8a1446', '#250412', '#c8256a', '#5c0f33']
};
function rgb(h){ return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255]; }

var fundo = (function(){
  var canvas = document.getElementById('fundo');
  var atual = PALETAS.forte.map(rgb), alvo = atual.map(function(c){ return c.slice(); });
  var gl = null, prog, uT, uR, uC = [], tempo = 0, vivo = false;

  function cssFundo(p){
    palco.style.background =
      'radial-gradient(circle at 22% 25%, ' + p[1] + ' 0, transparent 55%),' +
      'radial-gradient(circle at 80% 35%, ' + p[2] + ' 0, transparent 50%),' +
      'radial-gradient(circle at 35% 82%, ' + p[3] + ' 0, transparent 55%),' +
      'radial-gradient(circle at 85% 88%, ' + p[4] + ' 0, transparent 45%),' + p[0];
  }
  function iniciar(){
    try { gl = canvas.getContext('webgl', { antialias: false, depth: false, alpha: false, powerPreference: 'low-power' }); } catch (e){ gl = null; }
    if (!gl){ palco.classList.add('sem-webgl'); return; }
    var vs = 'attribute vec2 p; varying vec2 v; void main(){ v = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
    var fs = [
      'precision mediump float;',
      'varying vec2 v; uniform float t; uniform vec2 res;',
      'uniform vec3 c0; uniform vec3 c1; uniform vec3 c2; uniform vec3 c3; uniform vec3 c4;',
      'float bolha(vec2 p, vec2 c, float r){ vec2 d = p - c; return exp(-dot(d, d) / (r * r)); }',
      'void main(){',
      '  float asp = res.x / res.y;',
      '  vec2 p = vec2(v.x * asp, v.y);',
      '  p += 0.05 * vec2(sin(p.y * 3.1 + t * 0.45), cos(p.x * 2.7 + t * 0.38));',
      '  vec2 a = vec2(asp * (0.22 + 0.16 * sin(t * 0.21)), 0.78 + 0.10 * cos(t * 0.17));',
      '  vec2 b = vec2(asp * (0.80 + 0.12 * cos(t * 0.19)), 0.64 + 0.14 * sin(t * 0.23));',
      '  vec2 c = vec2(asp * (0.32 + 0.20 * cos(t * 0.13 + 1.0)), 0.18 + 0.10 * sin(t * 0.29));',
      '  vec2 d = vec2(asp * (0.84 + 0.10 * sin(t * 0.27 + 2.0)), 0.12 + 0.10 * cos(t * 0.15));',
      '  vec3 cor = c0;',
      '  cor = mix(cor, c1, bolha(p, a, 0.46));',
      '  cor = mix(cor, c2, bolha(p, b, 0.40));',
      '  cor = mix(cor, c3, bolha(p, c, 0.44));',
      '  cor = mix(cor, c4, 0.85 * bolha(p, d, 0.34));',
      '  gl_FragColor = vec4(cor, 1.0);',
      '}'
    ].join('\n');
    function shader(tipo, src){ var s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s); return s; }
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){ gl = null; palco.classList.add('sem-webgl'); return; }
    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    uT = gl.getUniformLocation(prog, 't');
    uR = gl.getUniformLocation(prog, 'res');
    for (var i = 0; i < 5; i++) uC.push(gl.getUniformLocation(prog, 'c' + i));
    canvas.addEventListener('webglcontextlost', function(e){ e.preventDefault(); gl = null; palco.classList.add('sem-webgl'); });
    vivo = true;
    tamanho();
  }
  function tamanho(){
    if (!gl) return;
    // o fundo é só gradiente: desenhar pequeno e deixar o CSS esticar sai quase de graça
    var w = Math.max(90, Math.round(palco.clientWidth / 4)), h = Math.max(160, Math.round(palco.clientHeight / 4));
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  function paleta(nome){
    var p = PALETAS[nome] || PALETAS.claro;
    alvo = p.map(rgb);
    cssFundo(p);
    if (!vivo) atual = alvo.map(function(c){ return c.slice(); });
  }
  function desenhar(dt){
    if (!gl) return;
    tempo += dt;
    var k = 1 - Math.exp(-dt * 2.6);
    for (var i = 0; i < 5; i++){
      for (var j = 0; j < 3; j++) atual[i][j] += (alvo[i][j] - atual[i][j]) * k;
      gl.uniform3fv(uC[i], atual[i]);
    }
    gl.uniform1f(uT, tempo);
    gl.uniform2f(uR, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function encaixar(){ atual = alvo.map(function(c){ return c.slice(); }); }
  return { iniciar: iniciar, tamanho: tamanho, paleta: paleta, desenhar: desenhar, encaixar: encaixar };
})();

var atual = -1, decorrido = 0, pausado = false;

function ir(i){
  i = clamp(i, 0, HIST.length - 1);
  if (HIST[atual]){ HIST[atual].el.classList.remove('ativa'); if (HIST[atual].sair) HIST[atual].sair(HIST[atual].el); }

  decorrido = 0;

  palco.setAttribute('data-tema', h.barras || h.tema);
  palco.classList.toggle('no-comeco', i === 0);

  for (var b = 0; b < BARRAS.length; b++){
    BARRAS[b].className = 'barra' + (b < i - 1 ? ' feita' : (b === i - 1 ? ' agora' : ''));
    BARRAS[b].firstChild.style.transform = b < i - 1 ? 'scaleX(1)' : 'scaleX(0)';
  }
  h.contas.forEach(function(c){ c.ultimo = null; });
  if (h.entrar) h.entrar(h.el);
  passo(0);
}
function proxima(){ if (atual < HIST.length - 1) ir(atual + 1); }
function anterior(){ ir(atual > 1 ? atual - 1 : atual); }

function comecar(){
  if (comecou) return;
  comecou = true;
  // o iPhone só deixa tocar som se começar dentro do toque
  var primeira = HIST[1] && HIST[1].musica;
  if (COM_MUSICA){
    if (primeira){ faixa = primeira; audio.src = 'musicas/' + primeira + '.mp3'; }
    audio.muted = mudo;
    var p = audio.play(); if (p && p.catch) p.catch(function(){});
  }
  ir(1);
}

function passo(dt){
  var h = HIST[atual];
  if (h){
    if (!pausado) decorrido += dt;
    if (h.tick) h.tick(decorrido, h.el);
    for (var k = 0; k < h.contas.length; k++){
      var c = h.contas[k];
      var x = clamp((decorrido - c.d) / c.t, 0, 1);
      var v = Math.round(c.alvo * (1 - Math.pow(1 - x, 3)));
      if (v !== c.ultimo){ c.ultimo = v; c.el.textContent = fmt(v); }
    }
    if (atual > 0 && isFinite(h.dur)){
      var barra = BARRAS[atual - 1];
      if (barra) barra.firstChild.style.transform = 'scaleX(' + clamp(decorrido / h.dur, 0, 1).toFixed(4) + ')';
      if (decorrido >= h.dur && !TESTE) proxima();
    }
  }
  fundo.desenhar(dt);
}

/* toque: esquerda volta, direita passa, segurar pausa */
var segurando = null, segurou = false, toqueX = 0;
palco.addEventListener('pointerdown', function(e){
  if (e.target.closest('button')) return;
  toqueX = e.clientX;
  segurou = false;
  clearTimeout(segurando);
  segurando = setTimeout(function(){ segurou = true; pausado = true; palco.classList.add('pausado'); }, 230);
});
function soltar(e, cancelou){
  clearTimeout(segurando);
  if (segurou){ segurou = false; pausado = false; palco.classList.remove('pausado'); return; }
  if (cancelou || !comecou || e.target.closest('button')) return;
  var r = palco.getBoundingClientRect();
  if ((toqueX - r.left) / r.width < .3) anterior(); else proxima();
}
palco.addEventListener('pointerup', function(e){ soltar(e, false); });
palco.addEventListener('pointercancel', function(e){ soltar(e, true); });
// o primeiro toque é um "click" de verdade, que é o que o iPhone aceita pra liberar o som
palco.addEventListener('click', function(e){
  var botao = e.target.closest('button[data-acao]');
  var acao = botao ? botao.getAttribute('data-acao') : null;
  if (!comecou){ comecar(); return; }
  if (acao === 'denovo') ir(1);
  if (acao === 'salvar') salvarResumo(botao);
});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); if (!comecou) comecar(); else proxima(); }
  if (e.key === 'ArrowLeft' && comecou) anterior();
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ pausado = true; if (comecou) audio.pause(); }
  else { pausado = false; palco.classList.remove('pausado'); if (comecou && !mudo && COM_MUSICA){ var p = audio.play(); if (p && p.catch) p.catch(function(){}); } }
});

/* ---------- o resumo vira imagem pra salvar ---------- */
var arquivoResumo = null;
function carregarImagem(src){
  return new Promise(function(ok, erro){ var im = new Image(); im.onload = function(){ ok(im); }; im.onerror = erro; im.src = src; });
}
function prepararImagemResumo(){
  if (arquivoResumo) return;
  var pronto = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  pronto.then(function(){ return carregarImagem('fotos/resumo.jpg'); }).then(function(foto){
    var c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
    var g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 1080, 1920);
    gr.addColorStop(0, '#ff3d8b'); gr.addColorStop(.55, '#ff80b5'); gr.addColorStop(1, '#ffb59e');
    g.fillStyle = gr; g.fillRect(0, 0, 1080, 1920);
    // cartão creme
    function arredondado(x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    g.fillStyle = '#fff6ee'; arredondado(70, 120, 940, 1680, 56); g.fill();
    // foto
    g.save(); arredondado(110, 160, 860, 780, 40); g.clip();
    var escala = Math.max(860 / foto.width, 780 / foto.height), fw = foto.width * escala, fh = foto.height * escala;
    g.drawImage(foto, 110 + (860 - fw) / 2, 160 + (780 - fh) / 2, fw, fh);
    g.restore();
    var fonte = '"Bricolage Grotesque", system-ui, sans-serif';
    var itens = itensResumo();
    g.fillStyle = '#3b0820';
    itens.forEach(function(x, i){
      var cx = 120 + (i % 2) * 440, cy = 1020 + Math.floor(i / 2) * 165;
      g.globalAlpha = .6; g.font = '700 30px ' + fonte; g.fillText(x[0].toUpperCase(), cx, cy);
      g.globalAlpha = 1; g.font = '800 68px ' + fonte; g.fillText(x[1], cx, cy + 72);
    });
    g.globalAlpha = .7; g.font = '700 34px ' + fonte;
    g.fillText('o nosso wrapped · ' + (TEXTOS.aberturaDestaque || HOJE.getFullYear()), 120, 1730);
    g.textAlign = 'right'; g.fillText(TEXTOS.abertura, 960, 1730);
    c.toBlob(function(blob){ if (blob) arquivoResumo = new File([blob], 'nosso-wrapped.png', { type: 'image/png' }); }, 'image/png');
  }).catch(function(){});
}
function salvarResumo(botao){
  if (!arquivoResumo){ prepararImagemResumo(); botao.textContent = 'preparando...'; setTimeout(function(){ botao.textContent = 'salvar a imagem'; }, 1500); return; }
  // o compartilhar do iPhone precisa ser chamado direto no toque, por isso a imagem já fica pronta antes
  if (navigator.canShare && navigator.canShare({ files: [arquivoResumo] })){
    navigator.share({ files: [arquivoResumo], title: 'o nosso wrapped' }).catch(function(){});
  } else {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(arquivoResumo);
    a.download = 'nosso-wrapped.png';
    document.body.appendChild(a); a.click(); a.remove();
  }
}

/* ---------- tamanho ---------- */
function medir(){
  palco.style.setProperty('--u', (palco.clientWidth / 100) + 'px');
  palco.style.setProperty('--v', (palco.clientHeight / 100) + 'px');
  fundo.tamanho();
}
window.addEventListener('resize', medir);
medir();
fundo.iniciar();

/* ---------- começar ---------- */
if (TESTE){
  // modo de teste: nada anda sozinho. ?teste=1&historia=pedido&t=3 (sem t, mostra o final de tudo)
  var alvo = P.get('historia');
  var idx = alvo === null ? 0 : (isNaN(+alvo) ? HIST.findIndex(function(h){ return h.id === alvo; }) : +alvo);
  idx = Math.max(0, idx);
  var tParam = P.get('t');
  if (tParam === null) palco.classList.add('parado');
  if (idx > 0) comecou = true;
  ir(idx);
  fundo.encaixar();
  decorrido = tParam === null ? (isFinite(HIST[idx].dur) ? HIST[idx].dur - .01 : 30) : +tParam;
  passo(0);
  window.__wrapped = { quadro: function(dt){ passo(dt || 1 / 60); }, ir: ir, ids: HIST.map(function(h){ return h.id; }) };
} else {
  ir(0);
  var ultimo = performance.now();
  (function laco(agora){
    var dt = Math.min(.1, (agora - ultimo) / 1000);
    ultimo = agora;
    passo(dt);
    requestAnimationFrame(laco);
  })(ultimo);
}
</script>
